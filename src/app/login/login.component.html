<div class="page-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-circle">
        <span class="icon">🍽️</span>
      </div>
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas</p>
    </div>

    <!-- Mensajes de alerta para FA04 y FA05 -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>⚠️ {{ mensajeError }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correoElectronico">Correo electrónico</label>
        <div class="input-wrapper">
          <input 
            id="correoElectronico" 
            type="email" 
            maxlength="100"
            placeholder="Ingrese su correo electrónico"
            formControlName="correoElectronico" 
          />
        </div>
      </div>

<div class="form-group">
  <label for="password">Contraseña</label>
  <div class="input-wrapper">
    <input id="password" type="password" maxlength="20" placeholder="Ingrese su contraseña" formControlName="password" />
  </div>
  <!-- Enlace según CU-02 Paso 2 -->
  <div style="text-align: right; margin-top: 6px;">
    <a routerLink="/recuperar-password" style="color: #2563eb; font-size: 0.8rem; text-decoration: none;">
      ¿Olvidaste tu contraseña?
    </a>
  </div>
</div>

      <button type="submit" class="btn btn-primary">
        Ingresar al Sistema
      </button>
    </form>

    <div class="divider">
      <span>¿No tienes una cuenta?</span>
    </div>

    <div class="footer-actions">
      <!-- Texto exacto según CU-00: "Registrarse" -->
      <button type="button" class="btn btn-secondary" routerLink="/registro">
        Registrarse
      </button>
    </div>
  </div>
</div>
