<div class="page-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-circle">
        <span class="icon">🍽️</span>
      </div>
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Control de Quejas</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>⚠️ {{ mensajeError }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correoElectronico">Correo Electrónico</label>
        <div class="input-wrapper">
          <input id="correoElectronico" type="email" formControlName="correoElectronico" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input id="password" type="password" formControlName="password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary">
        Ingresar al Sistema
      </button>
    </form>

    <div class="divider">
      <span>¿No tienes una cuenta?</span>
    </div>

    <div class="footer-actions">
      <button type="button" class="btn btn-secondary" routerLink="/registro">
        Crear nueva cuenta
      </button>
    </div>
  </div>
</div>
