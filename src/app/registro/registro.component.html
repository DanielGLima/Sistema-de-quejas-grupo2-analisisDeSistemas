<div class="page-wrapper">
  <div class="registro-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Registrarse</p>
    </div>

    <!-- Mensajes de alerta de error -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>⚠️ {{ mensajeError }}</span>
    </div>

    <!-- Mensaje informativo de cancelación (FA03) o éxito -->
    <div *ngIf="mensajeInfo" class="alert alert-info">
      <span>ℹ️ {{ mensajeInfo }}</span>
    </div>


    <form [formGroup]="registroForm">
      <div class="form-group">
        <label for="nombreCompleto">nombre completo</label>
        <input 
          id="nombreCompleto" 
          type="text" 
          maxlength="100" 
          placeholder="Ingrese su nombre completo"
          formControlName="nombreCompleto" 
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="fechaNacimiento">fecha de nacimiento</label>
          <input 
            id="fechaNacimiento" 
            type="date" 
            formControlName="fechaNacimiento" 
          />
        </div>

        <div class="form-group">
          <label for="nacionalidad">nacionalidad</label>
          <select id="nacionalidad" formControlName="nacionalidad">
            <option value="">Seleccione una nacionalidad</option>
            <option *ngFor="let nac of listaNacionalidades" [value]="nac">{{ nac }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input 
          id="correoElectronico" 
          type="email" 
          maxlength="100" 
          placeholder="ejemplo@correo.com"
          formControlName="correoElectronico" 
        />
      </div>

      <div class="form-row">
        <div class="form-group codigo-area">
          <label for="codigoArea">código de área telefónico</label>
          <input 
            id="codigoArea" 
            type="text" 
            maxlength="4" 
            placeholder="502"
            formControlName="codigoArea" 
          />
        </div>

        <div class="form-group telefono">
          <label for="telefono">teléfono (8 dígitos)</label>
          <input 
            id="telefono" 
            type="text" 
            maxlength="8" 
            placeholder="12345678"
            formControlName="telefono" 
          />
        </div>
      </div>

      <div class="form-group">
        <label for="direccion">dirección residencial</label>
        <input 
          id="direccion" 
          type="text" 
          maxlength="150" 
          placeholder="Ingrese su dirección residencial"
          formControlName="direccion" 
        />
      </div>

      <!-- Paso 4: Botón Crear nueva cuenta para habilitar ingreso de contraseña -->
      <button *ngIf="!pasoPassword" type="button" class="btn btn-primary" (click)="habilitarPassword()">
        Crear nueva cuenta
      </button>

      <!-- Paso 5: Ingreso y confirmación de contraseña -->
      <div *ngIf="pasoPassword" class="seccion-password">
        <div class="divider">
          <span>Seguridad de la Cuenta</span>
        </div>

        <div class="form-group">
          <label for="password">contraseña</label>
          <input 
            id="password" 
            type="password" 
            maxlength="20" 
            placeholder="Mínimo 6 caracteres"
            formControlName="password" 
          />
        </div>

        <div class="form-group">
          <label for="confirmarPassword">confirmar contraseña</label>
          <input 
            id="confirmarPassword" 
            type="password" 
            maxlength="20" 
            placeholder="Repita su contraseña"
            formControlName="confirmarPassword" 
          />
        </div>

        <button type="button" class="btn btn-success" (click)="solicitarConfirmacion()">
          Registrar Usuario
        </button>
      </div>
    </form>

    <!-- Modal de confirmación (Pasos 6 y 7, FA03) -->
    <div *ngIf="mostrarModalConfirmacion" class="modal-backdrop">
      <div class="modal-card">
        <h3>Confirmación</h3>
        <p>¿Está seguro de proceder con el registro de su cuenta?</p>
        <div class="modal-buttons">
          <button type="button" class="btn btn-primary" (click)="confirmarRegistro(true)">Sí</button>
          <button type="button" class="btn btn-secondary" (click)="confirmarRegistro(false)">No</button>
        </div>
      </div>
    </div>

    <!-- FA04: Enlace de retorno -->
    <div class="footer-actions">
      <a routerLink="/login" class="back-link">
        Volver al Inicio de Sesión
      </a>
    </div>
  </div>
</div>
