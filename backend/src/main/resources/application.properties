spring.application.name=SistemaDeQuejas

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistemadequejas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CU-05: evidencias hasta 2 MB por archivo; el limite real se valida en
# FileStorageService, esto solo evita que Spring corte la subida antes.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=20MB

# TEMPORAL: diagnostico del 403 en POST/PUT/DELETE. Quitar despues.
logging.level.org.springframework.security=DEBUG
