spring.application.name=SistemaDeQuejas

# Puerto configurable porque 8080 puede estar ocupado por otro proyecto local.
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistemadequejas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# NOTA: el mensaje de los ResponseStatusException (ej. "Correo no
# registrado", "Contrasena actual incorrecta") ya no depende de la
# configuracion por defecto de Spring Boot para las respuestas de error.
# Ver GlobalExceptionHandler, que construye ese JSON explicitamente con un
# campo "message" fijo, tal como lo espera el frontend Angular.

# CU-05: evidencias hasta 2 MB por archivo; el limite real se valida en
# FileStorageService, esto solo evita que Spring corte la subida antes.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=20MB

# CU-02 (envio de codigo) y CU-05 (confirmacion de caso). Credenciales por
# variable de entorno, nunca en este archivo (se sube al repositorio).
# Para Gmail: MAIL_USERNAME es la cuenta completa, MAIL_PASSWORD es una
# "contrasena de aplicacion" generada en la cuenta de Google (no la contrasena normal).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Tiempos maximos de espera SMTP para que un servidor caido no bloquee la peticion (CU-14).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cuenta inicial de Administrador General (CU-13). Solo se crea si no existe
# ningun personal y ADMIN_PASSWORD esta definida (variable de entorno).
app.admin.correo=${ADMIN_EMAIL:admin@lasdelicias.com.gt}
app.admin.nombre=${ADMIN_NOMBRE:Administrador General}
app.admin.password=${ADMIN_PASSWORD:}
