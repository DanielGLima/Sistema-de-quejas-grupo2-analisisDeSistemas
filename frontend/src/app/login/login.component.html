<div class="page-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-icon">🍽️</div>
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>⚠️ {{ mensajeError }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
      <!-- correo electrónico en minúsculas -->
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input
          id="correoElectronico"
          type="email"
          maxlength="100"
          placeholder="Ingrese su correo electrónico"
          formControlName="correoElectronico"
        />
      </div>

      <!-- contraseña en minúsculas -->
      <div class="form-group">
        <label for="password">contraseña</label>
        <input
          id="password"
          type="password"
          maxlength="20"
          placeholder="Ingrese su contraseña"
          formControlName="password"
        />
      </div>

      <div class="forgot-link-container">
        <a routerLink="/recuperar-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary">
        Ingresar al Sistema
      </button>
    </form>

    <div class="divider">
      <span>¿No tienes una cuenta?</span>
    </div>

    <a routerLink="/registro" class="btn btn-secondary register-btn">
      Registrarse
    </a>
  </div>
</div>
