<app-navbar></app-navbar>
<div class="page-wrapper">
  <div class="caso-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Registrar Nuevo Caso</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>⚠️ {{ mensajeError }}</span>
    </div>

    <div *ngIf="mensajeInfo" class="alert alert-info">
      <span>ℹ️ {{ mensajeInfo }}</span>
    </div>

    <form [formGroup]="casoForm" (ngSubmit)="solicitarConfirmacion()">
      <!-- tipo de caso -->
      <div class="form-group">
        <label for="idTipoCaso">tipo de caso</label>
        <select id="idTipoCaso" formControlName="idTipoCaso">
          <option value="" disabled selected>Seleccione un tipo de caso</option>
          <option *ngFor="let tipo of tiposCaso" [value]="tipo.idTipoCaso">{{ tipo.nombre }}</option>
        </select>
      </div>

      <!-- sucursal -->
      <div class="form-group">
        <label for="idSucursal">sucursal</label>
        <select id="idSucursal" formControlName="idSucursal">
          <option value="" disabled selected>Seleccione una sucursal</option>
          <option *ngFor="let suc of sucursales" [value]="suc.idSucursal">{{ suc.nombreSucursal }}</option>
        </select>
      </div>

      <!-- categoría (aplica principalmente a Quejas y Reclamos) -->
      <div class="form-group">
        <label for="idCategoria">categoría (opcional)</label>
        <select id="idCategoria" formControlName="idCategoria">
          <option value="">No aplica</option>
          <option *ngFor="let cat of categorias" [value]="cat.idCategoria">{{ cat.nombre }}</option>
        </select>
      </div>

      <div class="form-row">
        <!-- número de factura -->
        <div class="form-group">
          <label for="numeroFactura">número de factura (opcional)</label>
          <input
            id="numeroFactura"
            type="text"
            maxlength="20"
            formControlName="numeroFactura"
          />
        </div>

        <!-- empleado involucrado -->
        <div class="form-group">
          <label for="nombreEmpleadoInvolucrado">nombre del empleado involucrado (opcional)</label>
          <input
            id="nombreEmpleadoInvolucrado"
            type="text"
            maxlength="100"
            formControlName="nombreEmpleadoInvolucrado"
          />
        </div>
      </div>

      <!-- descripción del caso -->
      <div class="form-group">
        <label for="descripcion">descripción del caso</label>
        <textarea
          id="descripcion"
          rows="4"
          maxlength="1000"
          placeholder="Describa detalladamente lo sucedido (mínimo 10 caracteres)..."
          formControlName="descripcion">
        </textarea>
      </div>

      <!-- denuncia anónima -->
      <div class="form-group form-check">
        <label>
          <input type="checkbox" formControlName="esAnonimo" />
          Registrar como anónimo (aplica principalmente a Denuncias)
        </label>
      </div>

      <!-- adjuntar evidencias -->
      <div class="form-group">
        <label for="archivos">adjuntar evidencias (opcional, PDF/JPG/PNG máx 2MB por archivo)</label>
        <input
          id="archivos"
          type="file"
          multiple
          accept=".pdf,.jpg,.jpeg,.png"
          (change)="alSeleccionarArchivos($event)"
        />
        <small *ngIf="archivosSeleccionados.length" class="file-name">
          {{ archivosSeleccionados.length }} archivo(s) seleccionado(s): {{ archivosSeleccionados.map(a => a.name).join(', ') }}
        </small>
      </div>

      <button type="submit" class="btn btn-primary">
        Registrar Caso
      </button>
    </form>

    <!-- Modal de confirmación -->
    <div *ngIf="mostrarModalConfirmacion" class="modal-backdrop">
      <div class="modal-card">
        <h3>Confirmación</h3>
        <p>¿Está seguro de proceder con el registro de este caso?</p>
        <div class="modal-buttons">
          <button type="button" class="btn btn-primary" (click)="confirmarRegistro(true)">Sí</button>
          <button type="button" class="btn btn-secondary" (click)="confirmarRegistro(false)">No</button>
        </div>
      </div>
    </div>
  </div>
</div>
