<app-navbar></app-navbar>
<div class="page-wrapper">
  <div class="perfil-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Actualizar Perfil de Usuario</p>
    </div>

    <!-- FA01: Mensaje de error -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>{{ mensajeError }}</span>
    </div>

    <!-- Flujo Normal: Mensaje de exito -->
    <div *ngIf="mensajeExito" class="alert alert-success">
      <span>{{ mensajeExito }}</span>
    </div>

    <!-- FA02: Mensaje informativo de cancelacion -->
    <div *ngIf="mensajeInfo" class="alert alert-info">
      <span>{{ mensajeInfo }}</span>
    </div>

    <form [formGroup]="perfilForm" (ngSubmit)="solicitarConfirmacion()">
      <!-- nombre completo -->
      <div class="form-group">
        <label for="nombreCompleto">nombre completo</label>
        <input 
          id="nombreCompleto" 
          type="text" 
          maxlength="100"
          formControlName="nombreCompleto" 
          placeholder="Ingrese su nombre completo"
          [class.is-invalid]="esInvalido('nombreCompleto')"
          (input)="soloLetras($event, 'nombreCompleto')"
        />
      </div>

      <div class="form-row">
        <!-- fecha de nacimiento -->
        <div class="form-group">
          <label for="fechaNacimiento">fecha de nacimiento</label>
          <input 
            id="fechaNacimiento" 
            type="date" 
            [max]="fechaMaximaHoy"
            formControlName="fechaNacimiento" 
            [class.is-invalid]="esInvalido('fechaNacimiento')"
          />
        </div>

        <!-- nacionalidad -->
        <div class="form-group">
          <label for="nacionalidad">nacionalidad</label>
          <select 
            id="nacionalidad" 
            formControlName="nacionalidad"
            [class.is-invalid]="esInvalido('nacionalidad')"
          >
            <option value="">Seleccione una nacionalidad</option>
            <option *ngFor="let nac of listaNacionalidades" [value]="nac">{{ nac }}</option>
          </select>
        </div>
      </div>

      <!-- correo electrónico (Solo lectura) -->
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input 
          id="correoElectronico" 
          type="email" 
          formControlName="correoElectronico" 
        />
        <small class="help-text">El correo electrónico no puede ser modificado.</small>
      </div>

      <div class="form-row">
        <!-- código de área -->
        <div class="form-group codigo-area">
          <label for="codigoArea">código de área</label>
          <input 
            id="codigoArea" 
            type="text" 
            maxlength="3" 
            placeholder="502"
            formControlName="codigoArea" 
            [class.is-invalid]="esInvalido('codigoArea')"
            (input)="soloNumeros($event, 'codigoArea')"
          />
        </div>

        <!-- teléfono -->
        <div class="form-group telefono">
          <label for="telefono">número de teléfono</label>
          <input 
            id="telefono" 
            type="text" 
            maxlength="8" 
            placeholder="12345678"
            formControlName="telefono" 
            [class.is-invalid]="esInvalido('telefono')"
            (input)="soloNumeros($event, 'telefono')"
          />
        </div>
      </div>

      <!-- dirección residencial -->
      <div class="form-group">
        <label for="direccion">dirección residencial</label>
        <input 
          id="direccion" 
          type="text" 
          maxlength="150" 
          placeholder="Ingrese su dirección"
          formControlName="direccion" 
          [class.is-invalid]="esInvalido('direccion')"
        />
      </div>

      <!-- Botón de acción principal -->
      <button type="submit" class="btn btn-primary" [disabled]="cargando">
        Actualizar Datos
      </button>
    </form>

    <!-- FA02: Modal de confirmación (Paso 5) -->
    <div *ngIf="mostrarModalConfirmacion" class="modal-backdrop">
      <div class="modal-card">
        <h3>Confirmación</h3>
        <p>¿Está seguro de que desea guardar los cambios en su perfil?</p>
        <div class="modal-buttons">
          <button type="button" class="btn btn-primary" (click)="confirmarActualizacion(true)">Sí</button>
          <button type="button" class="btn btn-secondary" (click)="confirmarActualizacion(false)">No</button>
        </div>
      </div>
    </div>
  </div>
</div>
