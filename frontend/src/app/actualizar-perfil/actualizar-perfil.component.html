<app-navbar></app-navbar>
<div class="page-wrapper">
  <div class="perfil-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Actualizar Perfil de Usuario</p>
    </div>

    <!-- Mensajes de estado -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>{{ mensajeError }}</span>
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success">
      <span>✅ {{ mensajeExito }}</span>
    </div>

    <div *ngIf="mensajeInfo" class="alert alert-info">
      <span>ℹ️ {{ mensajeInfo }}</span>
    </div>

    <form *ngIf="!cargando" [formGroup]="perfilForm" (ngSubmit)="solicitarConfirmacion()">
      <!-- nombre completo -->
      <div class="form-group">
        <label for="nombreCompleto">nombre completo</label>
        <input
          id="nombreCompleto"
          type="text"
          maxlength="100"
          formControlName="nombreCompleto"
        />
      </div>

      <div class="form-row">
        <!-- fecha de nacimiento -->
        <div class="form-group">
          <label for="fechaNacimiento">fecha de nacimiento</label>
          <input
            id="fechaNacimiento"
            type="date"
            formControlName="fechaNacimiento"
          />
        </div>

        <!-- nacionalidad -->
        <div class="form-group">
          <label for="nacionalidad">nacionalidad</label>
          <input
            id="nacionalidad"
            type="text"
            formControlName="nacionalidad"
          />
        </div>
      </div>

      <!-- correo electrónico -->
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input
          id="correoElectronico"
          type="email"
          maxlength="100"
          formControlName="correoElectronico"
        />
      </div>

      <div class="form-row">
        <!-- código de área -->
        <div class="form-group">
          <label for="codigoArea">código de área</label>
          <input
            id="codigoArea"
            type="text"
            maxlength="4"
            formControlName="codigoArea"
          />
        </div>

        <!-- teléfono -->
        <div class="form-group">
          <label for="telefono">teléfono</label>
          <input
            id="telefono"
            type="text"
            maxlength="8"
            placeholder="Ej: 55443322"
            formControlName="telefono"
          />
        </div>
      </div>

      <!-- dirección -->
      <div class="form-group">
        <label for="direccion">dirección</label>
        <input
          id="direccion"
          type="text"
          maxlength="150"
          formControlName="direccion"
        />
      </div>

      <!-- FA01: cambio de contraseña, opcional -->
      <div class="form-row">
        <div class="form-group">
          <label for="passwordActual">contraseña actual</label>
          <input
            id="passwordActual"
            type="password"
            maxlength="20"
            placeholder="Solo si va a cambiar su contraseña"
            formControlName="passwordActual"
          />
        </div>

        <div class="form-group">
          <label for="passwordNueva">contraseña nueva</label>
          <input
            id="passwordNueva"
            type="password"
            maxlength="20"
            placeholder="Dejar vacío para no cambiarla"
            formControlName="passwordNueva"
          />
        </div>
      </div>

      <!-- Botón de acción principal -->
      <button type="submit" class="btn btn-primary">
        Actualizar Datos
      </button>
    </form>

    <!-- Modal de confirmación (Paso 5 y 6) -->
    <div *ngIf="mostrarModalConfirmacion" class="modal-backdrop">
      <div class="modal-card">
        <h3>Confirmación</h3>
        <p>¿Está seguro de que desea guardar los cambios en su perfil?</p>
        <div class="modal-buttons">
          <button type="button" class="btn btn-primary" (click)="confirmarActualizacion(true)">Sí</button>
          <button type="button" class="btn btn-secondary" (click)="confirmarActualizacion(false)">No</button>
        </div>
      </div>
    </div>
  </div>
</div>
