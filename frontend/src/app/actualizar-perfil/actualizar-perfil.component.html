<app-navbar></app-navbar>
<div class="page-wrapper">
  <div class="perfil-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Actualizar Perfil de Usuario</p>
    </div>

    <!-- Mensajes de estado -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>{{ mensajeError }}</span>
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success">
      <span>✅ {{ mensajeExito }}</span>
    </div>

    <div *ngIf="mensajeInfo" class="alert alert-info">
      <span>ℹ️ {{ mensajeInfo }}</span>
    </div>

    <form *ngIf="!cargando" [formGroup]="perfilForm" (ngSubmit)="guardarCambios()">
      <!-- nombre completo -->
      <div class="form-group">
        <label for="nombreCompleto">nombre completo</label>
        <input
          id="nombreCompleto"
          type="text"
          maxlength="100"
          formControlName="nombreCompleto"
          (input)="soloTexto($event)"
        />
      </div>

      <div class="form-row">
        <!-- fecha de nacimiento -->
        <div class="form-group">
          <label for="fechaNacimiento">fecha de nacimiento</label>
          <input
            id="fechaNacimiento"
            type="text"
            maxlength="10"
            placeholder="dd/mm/aaaa"
            formControlName="fechaNacimiento"
            (input)="formatearFecha($event)"
          />
        </div>

        <!-- nacionalidad -->
        <div class="form-group">
          <label for="nacionalidad">nacionalidad</label>
          <select id="nacionalidad" formControlName="nacionalidad">
            <option value="">Seleccione una nacionalidad</option>
            <option *ngFor="let nac of listaNacionalidades" [value]="nac">{{ nac }}</option>
          </select>
        </div>
      </div>

      <!-- correo electrónico -->
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input
          id="correoElectronico"
          type="email"
          maxlength="100"
          formControlName="correoElectronico"
        />
      </div>

      <div class="form-row">
        <!-- código de área -->
        <div class="form-group">
          <label for="codigoArea">código de área telefónico</label>
          <input
            id="codigoArea"
            type="text"
            inputmode="numeric"
            maxlength="4"
            formControlName="codigoArea"
            (input)="soloNumeros($event, 'codigoArea')"
          />
        </div>

        <!-- teléfono -->
        <div class="form-group">
          <label for="numero de telefono">teléfono</label>
          <input
            id="telefono"
            type="text"
            inputmode="numeric"
            maxlength="8"
            placeholder="Ej: 55443322"
            formControlName="telefono"
            (input)="soloNumeros($event, 'telefono')"
          />
        </div>
      </div>

      <!-- dirección -->
      <div class="form-group">
        <label for="direccion">dirección</label>
        <input
          id="direccion"
          type="text"
          maxlength="150"
          formControlName="direccion"
        />
        <small class="help-text">Llenar unicamente si cambiara contraseña</small>
      </div>

      <!-- FA01: cambio de contraseña, opcional -->
      <div class="form-row">
        <div class="form-group">
          <label for="passwordActual">contraseña actual</label>
          <input
            id="passwordActual"
            type="password"
            maxlength="20"
            formControlName="passwordActual"
          />
        </div>

        <div class="form-group">
          <label for="passwordNueva">contraseña nueva</label>
          <input
            id="passwordNueva"
            type="password"
            maxlength="20"
            placeholder=""
            formControlName="passwordNueva"
          />
        </div>
      </div>

      <!-- Botón de acción principal -->
      <button type="submit" class="btn btn-primary">
        Guardar cambios
      </button>
    </form>

  </div>
</div>
