<app-navbar></app-navbar>

<div class="page-wrapper">
  <div class="perfil-card">
    <div class="brand-header">
      <h2>Mi perfil</h2>
      <p class="subtitle">Consulte y actualice sus datos personales</p>
    </div>

    <!-- Mensajes de estado (FA19, FA20, FA21) -->
    <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
      <span>{{ mensajeError }}</span>
    </div>

    <!-- Paso 8: Mensaje de éxito -->
    <div *ngIf="mensajeExito" class="alert alert-success" role="status">
      <span>{{ mensajeExito }}</span>
    </div>

    <form *ngIf="!cargando" [formGroup]="perfilForm" (ngSubmit)="guardarCambios()" novalidate>
      <!-- nombre completo -->
      <div class="form-group">
        <label for="nombreCompleto">nombre completo</label>
        <input
          id="nombreCompleto"
          type="text"          formControlName="nombreCompleto"
        />
      </div>

      <div class="form-row">
        <!-- fecha de nacimiento -->
        <div class="form-group">
          <label for="fechaNacimiento">fecha de nacimiento</label>
          <input
            id="fechaNacimiento"
            type="text"            placeholder="DD/MM/AAAA"
            formControlName="fechaNacimiento"
          />
        </div>

        <!-- nacionalidad -->
        <div class="form-group">
          <label for="nacionalidad">nacionalidad</label>
          <select id="nacionalidad" formControlName="nacionalidad">
            <option value="">Seleccione una nacionalidad</option>
            <option *ngFor="let nac of listaNacionalidades" [value]="nac">{{ nac }}</option>
          </select>
        </div>
      </div>

      <!-- correo electrónico -->
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input
          id="correoElectronico"
          type="email"          formControlName="correoElectronico"
        />
      </div>

      <div class="form-row">
        <!-- código de área -->
        <div class="form-group">
          <label for="codigoArea">código de área telefónico</label>
          <input
            id="codigoArea"
            type="text"
            inputmode="numeric"            formControlName="codigoArea"
          />
        </div>

        <!-- número de teléfono -->
        <div class="form-group">
          <label for="telefono">número de teléfono</label>
          <input
            id="telefono"
            type="text"
            inputmode="numeric"            placeholder="12345678"
            formControlName="telefono"
          />
        </div>
      </div>

      <!-- dirección -->
      <div class="form-group">
        <label for="direccion">dirección</label>
        <input
          id="direccion"
          type="text"          formControlName="direccion"
        />
      </div>

      <!-- Sección de Seguridad / Cambio de contraseña opcional -->
      <div class="divider">
        <span>Seguridad de la cuenta</span>
      </div>
      <p class="section-hint">Llenar únicamente si desea cambiar su contraseña</p>

      <div class="form-row">
        <div class="form-group">
          <label for="passwordActual">contraseña actual</label>
          <input
            id="passwordActual"
            type="password"            formControlName="passwordActual"
            autocomplete="current-password"
          />
        </div>

        <div class="form-group">
          <label for="passwordNueva">nueva contraseña</label>
          <input
            id="passwordNueva"
            type="password"            placeholder="Mínimo 6 y máximo 20 caracteres"
            formControlName="passwordNueva"
            autocomplete="new-password"
          />
        </div>
      </div>

      <!-- Paso 4: Botón Guardar cambios -->
      <button type="submit" class="btn btn-primary" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </div>
</div>
