<aside class="menu-lateral">
  <!-- Marca -->
  <a class="marca" [routerLink]="esPersonal ? '/gestionar-casos' : '/consultar-casos'">
    <i class="punto"></i>
    <span class="marca-texto">
      <span class="marca-nombre">Las Delicias</span>
      <span class="marca-sub">{{ esPersonal ? 'Panel administrativo' : 'Quejas y sugerencias' }}</span>
    </span>
  </a>

  <nav class="enlaces" aria-label="Principal">
    <!-- Menú para Clientes (CU-01 a CU-06) -->
    <ng-container *ngIf="!esPersonal">
      <a routerLink="/registrar-caso" routerLinkActive="activo" class="enlace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nuevo caso</span>
      </a>
      <a routerLink="/consultar-casos" routerLinkActive="activo" class="enlace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Mis casos</span>
      </a>
      <a routerLink="/actualizar-perfil" routerLinkActive="activo" class="enlace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>Mi perfil</span>
      </a>
    </ng-container>

    <!-- Menú para Personal Interno (CU-07 a CU-10 / CU-13) -->
    <ng-container *ngIf="esPersonal">
      <a routerLink="/gestionar-casos" routerLinkActive="activo" class="enlace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 10h16"/></svg>
        <span>Gestión de casos</span>
      </a>
      <a *ngIf="esAdministrador" routerLink="/administrar" routerLinkActive="activo" class="enlace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <span>Administración</span>
      </a>
    </ng-container>
  </nav>

  <div class="relleno"></div>

  <div class="usuario">
    <div class="usuario-datos">
      <span class="usuario-rol">{{ etiquetaRol }}</span>
    </div>
    <!-- CU-00 Flujo Normal 2: Cerrar sesión permanentemente visible y accesible -->
    <button type="button" class="enlace cerrar" (click)="cerrarSesion()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>
