<header class="navbar-wrapper">
  <!-- Brand / Logo -->
  <div class="brand-badge" [routerLink]="rolPersonal ? '/gestionar-casos' : '/consultar-casos'">
    <div class="logo-circle">🍽️</div>
    <div class="brand-text">
      <span class="brand-name">Las Delicias</span>
      <span class="brand-tag">{{ rolPersonal ? 'Panel Administrativo' : 'Portal de Quejas' }}</span>
    </div>
  </div>

  <!-- Navigation Links / Action Pills -->
  <nav class="nav-actions">
    <ng-container *ngIf="!rolPersonal">
      <a routerLink="/registrar-caso" routerLinkActive="active" class="nav-pill">
        <span class="pill-icon">➕</span>
        <span class="pill-text">Nuevo Caso</span>
      </a>

      <a routerLink="/consultar-casos" routerLinkActive="active" class="nav-pill">
        <span class="pill-icon">📋</span>
        <span class="pill-text">Mis Casos</span>
      </a>

      <a routerLink="/actualizar-perfil" routerLinkActive="active" class="nav-pill">
        <span class="pill-icon">👤</span>
        <span class="pill-text">Mi Perfil</span>
      </a>
    </ng-container>

    <ng-container *ngIf="rolPersonal">
      <a routerLink="/gestionar-casos" routerLinkActive="active" class="nav-pill">
        <span class="pill-icon">🗂️</span>
        <span class="pill-text">Gestión de Casos</span>
      </a>

      <a *ngIf="rolPersonal === 'Administrador General'" routerLink="/administrar" routerLinkActive="active" class="nav-pill">
        <span class="pill-icon">⚙️</span>
        <span class="pill-text">Administración</span>
      </a>
    </ng-container>

    <!-- Botón Creativo Cerrar Sesión (CU-04) -->
    <button type="button" class="btn-logout" (click)="cerrarSesion()">
      <span class="logout-icon">🚪</span>
      <span class="logout-text">Cerrar Sesión</span>
    </button>
  </nav>
</header>
