<div class="page-wrapper fondo-foto">
  <div class="recuperar-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Recuperar Contraseña</p>
    </div>

    <!-- Mensajes de error: FA08 a FA17 -->
    <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
      <span>{{ mensajeError }}</span>
    </div>

    <!-- Mensaje informativo de código enviado (Paso 6) o éxito final (Paso 14) -->
    <div *ngIf="mensajeExito" class="alert alert-success" role="status">
      <span>{{ mensajeExito }}</span>
    </div>

    <!-- FASE 1: Paso 3 - Solicitar correo; Paso 5 - Botón ENVIAR (FA08, FA09, FA10) -->
    <form *ngIf="!faseCodigoEnviado" [formGroup]="correoForm" (ngSubmit)="enviarCorreo()" novalidate>
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input 
          id="correoElectronico" 
          type="email" 
          maxlength="100" 
          placeholder="Ingrese su correo electrónico registrado"
          formControlName="correoElectronico" 
          autocomplete="email"
        />
      </div>

      <!-- Paso 5: Botón ENVIAR -->
      <button type="submit" class="btn btn-primary" [disabled]="cargando">
        {{ cargando ? 'Enviando...' : 'ENVIAR' }}
      </button>
    </form>

    <!-- FASE 2: Paso 8 - Código; Paso 9 - Nueva Contraseña; Paso 10 - Botón Validar (FA11 a FA17) -->
    <form *ngIf="faseCodigoEnviado" [formGroup]="validacionForm" (ngSubmit)="validarYRestablecer()" novalidate>
      <div class="form-group">
        <label for="codigoRecuperacion">código de recuperación</label>
        <input 
          id="codigoRecuperacion" 
          type="text" 
          maxlength="6" 
          placeholder="Código de 6 caracteres"
          formControlName="codigoRecuperacion" 
          autocomplete="one-time-code"
        />
      </div>

      <div class="form-group">
        <label for="nuevaPassword">contraseña</label>
        <input 
          id="nuevaPassword" 
          type="password" 
          maxlength="20" 
          placeholder="Mínimo 6 y máximo 20 caracteres"
          formControlName="nuevaPassword" 
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmacionPassword">confirmar contraseña</label>
        <input 
          id="confirmacionPassword" 
          type="password" 
          maxlength="20" 
          placeholder="Repita su nueva contraseña"
          formControlName="confirmacionPassword" 
          autocomplete="new-password"
        />
      </div>

      <!-- Paso 10: Botón Validar -->
      <button type="submit" class="btn btn-primary" [disabled]="cargando">
        {{ cargando ? 'Validando...' : 'Validar' }}
      </button>
    </form>

    <!-- Paso 4 y Paso 11: FA18 - Cancelar y volver al inicio de sesión descartando cambios -->
    <div class="footer-actions">
      <a (click)="cancelarYVolver()" class="back-link" style="cursor: pointer;">
        Volver al Inicio de Sesión
      </a>
    </div>
  </div>
</div>
