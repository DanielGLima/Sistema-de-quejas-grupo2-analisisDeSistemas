<div class="page-wrapper">
  <div class="recuperar-card">
    <div class="brand-header">
      <h2>Restaurante Las Delicias</h2>
      <p class="subtitle">Sistema de Quejas - Recuperar Contraseña</p>
    </div>

    <!-- Mensaje de error (FA01, FA02, FA04 a FA10) -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      <span>{{ mensajeError }}</span>
    </div>

    <!-- Mensaje neutro de envío (Paso 5 / FA03) o éxito final (Paso 10) -->
    <div *ngIf="mensajeExito" class="alert alert-success">
      <span>✉️ {{ mensajeExito }}</span>
    </div>

    <!-- FASE 1: Paso 3 y 4 - Solicitar correo y botón ENVIAR -->
    <form *ngIf="!faseCodigoEnviado" [formGroup]="correoForm" (ngSubmit)="enviarCorreo()" novalidate>
      <div class="form-group">
        <label for="correoElectronico">correo electrónico</label>
        <input 
          id="correoElectronico" 
          type="email" 
          maxlength="100" 
          placeholder="Ingrese su correo electrónico registrado"
          formControlName="correoElectronico" 
          autocomplete="email"
        />
      </div>

      <!-- Paso 4: Botón ENVIAR -->
      <button type="submit" class="btn btn-primary">
        ENVIAR
      </button>
    </form>

    <!-- FASE 2: Pasos 6, 7 y 8 - Código, Nueva Contraseña y botón Validar -->
    <form *ngIf="faseCodigoEnviado" [formGroup]="validacionForm" (ngSubmit)="validarYRestablecer()" novalidate>
      <div class="form-group">
        <label for="codigoRecuperacion">código de recuperación</label>
        <input 
          id="codigoRecuperacion" 
          type="text" 
          maxlength="6" 
          placeholder="Código de 6 caracteres"
          formControlName="codigoRecuperacion" 
          autocomplete="one-time-code"
        />
      </div>

      <div class="form-group">
        <label for="nuevaPassword">nueva contraseña</label>
        <input 
          id="nuevaPassword" 
          type="password" 
          minlength="6"
          maxlength="20" 
          placeholder="Mínimo 6 caracteres"
          formControlName="nuevaPassword" 
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmacionPassword">confirmación de nueva contraseña</label>
        <input 
          id="confirmacionPassword" 
          type="password" 
          minlength="6"
          maxlength="20" 
          placeholder="Repita su nueva contraseña"
          formControlName="confirmacionPassword" 
          autocomplete="new-password"
        />
      </div>

      <!-- Paso 8: Botón Validar -->
      <button type="submit" class="btn btn-primary">
        Validar
      </button>
    </form>

    <div class="footer-actions">
      <a routerLink="/login" class="back-link">
        Volver al Inicio de Sesión
      </a>
    </div>
  </div>
</div>
